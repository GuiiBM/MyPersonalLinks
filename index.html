<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="color-scheme" content="light dark" />
  <title>Meus Links</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #f3f0e8;
      --fg: #1a1916;
      --muted: #6f6a5f;
      --line: #d9d3c4;
      --hover: #ebe6da;
      --serif: 'Instrument Serif', Georgia, serif;
      --sans: 'Instrument Sans', system-ui, sans-serif;
      --mono: 'JetBrains Mono', ui-monospace, monospace;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #141311;
        --fg: #ece8df;
        --muted: #8d887c;
        --line: #2c2a26;
        --hover: #1d1c19;
      }
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html { -webkit-text-size-adjust: 100%; }

    body {
      min-height: 100vh;
      background: var(--bg);
      color: var(--fg);
      font-family: var(--sans);
      font-size: 16px;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }

    .wrap {
      width: 100%;
      max-width: 960px;
      margin: 0 auto;
      padding: clamp(2.5rem, 8vw, 6rem) clamp(1rem, 4vw, 2.5rem) 4rem;
    }

    /* ---------- cabeçalho ---------- */

    header {
      display: grid;
      grid-template-columns: 1fr auto;
      align-items: end;
      gap: 1rem 2rem;
      padding-bottom: 1.5rem;
      border-bottom: 1px solid var(--fg);
    }

    h1 {
      font-family: var(--serif);
      font-weight: 400;
      font-size: clamp(3rem, 12vw, 6.5rem);
      line-height: .9;
      letter-spacing: -.02em;
    }

    h1 em { font-style: italic; color: var(--muted); }

    .intro {
      max-width: 22ch;
      font-size: .95rem;
      color: var(--muted);
      text-align: right;
    }

    /* ---------- filtros ---------- */

    .filters {
      display: flex;
      gap: .25rem 1.25rem;
      flex-wrap: wrap;
      padding: 1rem 0;
      border-bottom: 1px solid var(--line);
      font-family: var(--mono);
      font-size: .75rem;
      text-transform: lowercase;
    }

    .filters button {
      font: inherit;
      color: var(--muted);
      background: none;
      border: 0;
      padding: .35rem 0;
      cursor: pointer;
    }

    .filters button sup { font-size: .65em; margin-left: .15em; }

    .filters button:hover { color: var(--fg); }

    .filters button[aria-pressed="true"] {
      color: var(--fg);
      text-decoration: underline;
      text-underline-offset: .3em;
    }

    /* ---------- lista ---------- */

    .list { list-style: none; }

    .item a {
      --c: var(--fg);
      display: grid;
      grid-template-columns: 2rem 3rem 1fr minmax(0, 14rem) 1.5rem;
      grid-template-areas: "num icon text meta arrow";
      align-items: baseline;
      gap: 1.5rem;
      padding: 1.25rem .75rem;
      border-bottom: 1px solid var(--line);
      color: inherit;
      text-decoration: none;
      position: relative;
      transition: background .2s;
    }

    .item a::before {
      content: '';
      position: absolute;
      left: 0; top: 0; bottom: 0;
      width: 3px;
      background: var(--c);
      transform: scaleY(0);
      transform-origin: top;
      transition: transform .25s ease;
    }

    .num { grid-area: num; }
    .text { grid-area: text; min-width: 0; }
    .meta { grid-area: meta; }
    .arrow { grid-area: arrow; }

    .num {
      font-family: var(--mono);
      font-size: .75rem;
      color: var(--muted);
    }

    .title {
      font-family: var(--serif);
      font-size: clamp(1.5rem, 3.5vw, 2rem);
      line-height: 1.1;
      display: flex;
      align-items: baseline;
      gap: .6rem;
    }

    /* ícone: quadro fino com filete da cor do projeto na base */
    .icon {
      grid-area: icon;
      align-self: start;
      width: 3rem;
      height: 3rem;
      display: grid;
      place-items: center;
      border: 1px solid var(--line);
      border-radius: 3px;
      color: var(--fg);
      box-shadow: inset 0 -3px 0 var(--c);
      transition: background .25s, color .25s, border-color .25s;
    }

    .icon svg {
      width: 1.75rem;
      height: 1.75rem;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.3;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .icon .mono {
      font-family: var(--serif);
      font-size: 1.5rem;
      line-height: 1;
    }

    .desc {
      display: block;
      margin-top: .35rem;
      font-size: .9rem;
      color: var(--muted);
      max-width: 52ch;
    }

    .meta {
      font-family: var(--mono);
      font-size: .7rem;
      color: var(--muted);
      text-transform: lowercase;
      line-height: 1.6;
      overflow: hidden;
    }

    .meta > span:first-child:not(.domain) { white-space: nowrap; }

    .meta .domain {
      display: block;
      min-width: 0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .arrow {
      font-size: 1.1rem;
      color: var(--muted);
      text-align: right;
      transition: transform .25s ease, color .25s;
    }

    .item a:focus-visible {
      outline: 2px solid var(--fg);
      outline-offset: -2px;
    }

    @media (hover: hover) {
      .item a:hover { background: var(--hover); }
      .item a:hover::before { transform: scaleY(1); }
      .item a:hover .icon { background: var(--c); border-color: var(--c); color: var(--on); }
      .item a:hover .arrow { color: var(--fg); transform: translate(3px, -3px); }
    }

    .item[hidden] { display: none; }

    /* ---------- rodapé ---------- */

    footer {
      display: flex;
      justify-content: space-between;
      gap: 1rem;
      flex-wrap: wrap;
      margin-top: 3rem;
      font-family: var(--mono);
      font-size: .7rem;
      color: var(--muted);
    }

    /* ---------- responsivo ---------- */

    @media (max-width: 720px) {
      .item a {
        grid-template-columns: 2.75rem 1fr 1.25rem;
        grid-template-areas: "icon text arrow" "icon meta .";
        gap: 1rem;
      }
      .num { display: none; }
      .icon { width: 2.75rem; height: 2.75rem; }
      .meta {
        display: flex;
        gap: .75rem;
        min-width: 0;
        margin-top: -.5rem;
      }
    }

    @media (max-width: 480px) {
      header { grid-template-columns: 1fr; }
      .intro { text-align: left; max-width: none; }
      .item a {
        grid-template-columns: 2.5rem 1fr 1rem;
        grid-template-areas: "icon text arrow" "meta meta meta";
        gap: .75rem .9rem;
        padding: 1.1rem .75rem;
      }
      .icon { width: 2.5rem; height: 2.5rem; }
      .icon svg { width: 1.5rem; height: 1.5rem; }
      .meta { margin-top: 0; }
      .filters { flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; }
      .filters::-webkit-scrollbar { display: none; }
      .filters button { white-space: nowrap; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before { transition: none !important; }
    }
  </style>
</head>
<body>
  <main class="wrap">
    <header>
      <h1>Meus <em>links</em></h1>
      <p class="intro">Projetos, sites e experimentos reunidos num só lugar.</p>
    </header>

    <nav class="filters" id="filters" aria-label="Filtrar por categoria"></nav>

    <ol class="list" id="app"></ol>

    <footer>
      <span id="count"></span>
      <span>clique para abrir em nova aba ↗</span>
    </footer>
  </main>

  <script>
    const hexToRgb = h => {
      h = h.replace('#', '');
      if (h.length === 3) h = [...h].map(c => c + c).join('');
      return [0, 2, 4].map(i => parseInt(h.slice(i, i + 2), 16));
    };
    const blendColors = colors => {
      const avg = colors.map(hexToRgb).reduce((a, c) => a.map((v, i) => v + c[i])).map(v => Math.round(v / colors.length));
      return `rgb(${avg.join(',')})`;
    };
    const pad = n => String(n).padStart(2, '0');

    // cor legível sobre o fundo do ícone no hover
    const onColor = rgb => {
      const [r, g, b] = rgb.map(v => v / 255);
      return 0.2126 * r + 0.7152 * g + 0.0722 * b > 0.5 ? '#1a1916' : '#f3f0e8';
    };

    // conjunto de ícones próprio — grade 24×24, traço 1.4
    const ICONS = {
      megaphone: '<path d="M4 9.5v5l3 .5 11 4.5v-15L7 9z"/><path d="M7.5 15l1.5 4.5h2.5L10.5 16"/><path d="M21 10v4"/>',
      wave:      '<path d="M4 10v4M8 7v10M12 4v16M16 8v8M20 11v2"/>',
      calendar:  '<rect x="3.5" y="5" width="17" height="15.5" rx="1"/><path d="M3.5 10h17M8 3v4M16 3v4"/><path d="M8 14.5h2"/>',
      sheet:     '<rect x="3.5" y="4" width="17" height="16" rx="1"/><path d="M3.5 9.5h17M3.5 15h17M9.5 4v16"/>',
      no:        '<path d="M4 5h16v11h-9l-4 3.5V16H4z"/><path d="M10 8.5l4 4M14 8.5l-4 4"/>',
      swap:      '<path d="M4 8h14M14.5 4.5L18 8l-3.5 3.5"/><path d="M20 16H6M9.5 12.5L6 16l3.5 3.5"/>',
      coin:      '<circle cx="12" cy="12" r="8.5"/><path d="M14.5 9.3c-.5-.8-1.4-1.3-2.5-1.3-1.4 0-2.5.8-2.5 1.9 0 2.6 5 1.5 5 4.2 0 1.1-1.1 1.9-2.5 1.9-1.1 0-2.1-.5-2.6-1.3M12 6.5V8M12 16v1.5"/>',
      book:      '<path d="M12 6.5C10 5 7 4.5 3.5 5v13c3.5-.5 6.5 0 8.5 1.5 2-1.5 5-2 8.5-1.5V5C17 4.5 14 5 12 6.5zM12 6.5v13"/>',
      photos:    '<rect x="3.5" y="7" width="13.5" height="12" rx="1"/><path d="M7 4h12.5a1 1 0 0 1 1 1v10.5"/><circle cx="8" cy="11" r="1.2"/><path d="M3.5 17l4-3.5 3 2.5 2.5-2.5 4 3.5"/>',
      ticket:    '<path d="M3.5 7a1 1 0 0 1 1-1h15a1 1 0 0 1 1 1v3a2 2 0 0 0 0 4v3a1 1 0 0 1-1 1h-15a1 1 0 0 1-1-1v-3a2 2 0 0 0 0-4z"/><path d="M15 6v2M15 11v2M15 16v2"/>',
      scaffold:  '<path d="M5.5 3v18M18.5 3v18M3.5 8h17M3.5 14h17M5.5 8l13 6M18.5 14l-13 6"/>',
      terminal:  '<rect x="3.5" y="4.5" width="17" height="15" rx="1"/><path d="M7.5 9.5l3 2.5-3 2.5M13 15h4"/>',
      camera:    '<path d="M4.5 8H7l1.5-2.5h7L17 8h2.5a1 1 0 0 1 1 1v9.5a1 1 0 0 1-1 1h-15a1 1 0 0 1-1-1V9a1 1 0 0 1 1-1z"/><circle cx="12" cy="13.3" r="3.3"/>',
      face:      '<rect x="5.5" y="3.5" width="13" height="17" rx="1"/><circle cx="12" cy="10" r="2.4"/><path d="M8.3 16.5c.7-1.8 2.1-2.7 3.7-2.7s3 .9 3.7 2.7"/>',
      id:        '<rect x="3.5" y="5" width="17" height="14" rx="1"/><circle cx="8.5" cy="10.5" r="1.9"/><path d="M5.8 15.5c.5-1.4 1.5-2.1 2.7-2.1s2.2.7 2.7 2.1M14 10h3.5M14 13.5h2.5"/>'
    };

    const iconFor = (name, label) => ICONS[name]
      ? `<svg viewBox="0 0 24 24" aria-hidden="true">${ICONS[name]}</svg>`
      : `<span class="mono" aria-hidden="true">${label.trim()[0]}</span>`;

    fetch('links.json')
      .then(r => r.json())
      .then(links => {
        const app = document.getElementById('app');

        app.innerHTML = links.map(({ icon, label, description, tag, url, color }, i) => {
          url = url.trim();
          const colors = Array.isArray(color) ? color : [color || '#888888'];
          const c = colors.length > 1 ? blendColors(colors) : colors[0];
          const on = onColor(c.startsWith('#') ? hexToRgb(c) : c.match(/\d+/g).map(Number));
          const domain = url.replace(/^https?:\/\//, '').replace(/\/$/, '');
          return `
            <li class="item" data-tag="${tag || ''}">
              <a href="${url}" target="_blank" rel="noopener" style="--c:${c};--on:${on}">
                <span class="num">${pad(i + 1)}</span>
                <span class="icon">${iconFor(icon, label)}</span>
                <span class="text">
                  <span class="title">${label}</span>
                  ${description ? `<span class="desc">${description}</span>` : ''}
                </span>
                <span class="meta">
                  ${tag ? `<span>${tag}</span>` : ''}
                  <span class="domain">${domain}</span>
                </span>
                <span class="arrow" aria-hidden="true">↗</span>
              </a>
            </li>`;
        }).join('');

        // filtros por categoria
        const counts = links.reduce((acc, l) => {
          if (l.tag) acc[l.tag] = (acc[l.tag] || 0) + 1;
          return acc;
        }, {});
        const tags = ['Todos', ...Object.keys(counts)];
        const filters = document.getElementById('filters');
        const count = document.getElementById('count');

        filters.innerHTML = tags.map((t, i) =>
          `<button type="button" data-tag="${t}" aria-pressed="${i === 0}">${t}<sup>${i === 0 ? links.length : counts[t]}</sup></button>`
        ).join('');

        const apply = tag => {
          let shown = 0;
          app.querySelectorAll('.item').forEach(li => {
            const hide = tag !== 'Todos' && li.dataset.tag !== tag;
            li.hidden = hide;
            if (!hide) shown++;
          });
          filters.querySelectorAll('button').forEach(b => b.setAttribute('aria-pressed', b.dataset.tag === tag));
          count.textContent = `${pad(shown)} ${shown === 1 ? 'projeto' : 'projetos'}`;
        };

        filters.addEventListener('click', e => {
          const b = e.target.closest('button');
          if (b) apply(b.dataset.tag);
        });

        apply('Todos');
      });
  </script>
</body>
</html>
